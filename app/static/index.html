<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sintesi</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background: #fff;
      color: #000;
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      line-height: 1.5;
    }
    h1 { font-size: 2.4rem; margin: 0; letter-spacing: 1px; }
    h2 { font-size: 1.5rem; margin: 1.5rem 0 .25rem; }
    h3 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin: 1.5rem 0 .5rem; }
    .tagline { margin: .25rem 0 1.5rem; }
    hr { border: 0; border-top: 1px solid #000; margin: 1.5rem 0; }
    .search {
      display: flex;
      align-items: center;
      border: 1px solid #000;
      background: #fff;
    }
    .search:focus-within { outline: 1px solid #000; }
    .search svg { flex: none; width: 1.1rem; height: 1.1rem; margin: 0 .5rem; }
    input[type="search"] {
      flex: 1;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      padding: .5rem .5rem .5rem 0;
      border: 0;
      border-radius: 0;
      background: #fff;
      color: #000;
    }
    input[type="search"]:focus { outline: 0; }
    .search button {
      flex: none;
      font-family: inherit;
      font-size: 1rem;
      padding: .5rem 1rem;
      border: 0;
      border-left: 1px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
    }
    .search button:hover { background: #000; color: #fff; }
    .chips { margin: 1rem 0 0; }
    .chips button {
      font-family: inherit;
      font-size: 1rem;
      padding: .3rem .7rem;
      margin: 0 .4rem .4rem 0;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      cursor: pointer;
    }
    .chips button:hover { background: #000; color: #fff; }
    .meta { font-style: italic; }
    a { color: #000; }
    .hidden { display: none; }
    .topic { margin-bottom: .75rem; }
    .post { margin-bottom: .75rem; }
    .post-meta { font-style: italic; }
  </style>
</head>
<body>
  <h1>SINTESI</h1>
  <p class="tagline">The public consensus from Hacker News, summarized.</p>
  <hr />

  <form class="search" id="searchform" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <line x1="16.5" y1="16.5" x2="21" y2="21" />
    </svg>
    <input type="search" id="filter" placeholder="Get the real opinion on..." autocomplete="off" />
    <button type="submit" id="go">Read the room</button>
  </form>
  <div class="chips" id="chips"></div>

  <p id="status" class="meta hidden"></p>

  <section id="digest" class="hidden">
    <hr />
    <h2 id="d-title"></h2>
    <p id="d-meta" class="meta"></p>
    <p id="d-overview"></p>

    <h3>Hot topics</h3>
    <div id="d-topics"></div>

    <h3>Top posts</h3>
    <div id="d-posts"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let topics = [];

    async function loadTopics() {
      const res = await fetch("/api/topics");
      topics = await res.json();
      renderChips(topics);
    }

    function renderChips(list) {
      const box = $("chips");
      box.innerHTML = "";
      for (const t of list) {
        const b = document.createElement("button");
        b.textContent = t.display_name;
        b.onclick = () => loadDigest(t.slug);
        box.appendChild(b);
      }
    }

    $("filter").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      renderChips(topics.filter((t) => t.display_name.toLowerCase().includes(q)));
    });

    $("searchform").addEventListener("submit", (e) => {
      e.preventDefault();
      const raw = $("filter").value.trim();
      if (!raw) return;
      const q = raw.toLowerCase();
      const matches = topics.filter((t) => t.display_name.toLowerCase().includes(q));
      if (matches.length) {
        loadDigest(matches[0].slug);
      } else {
        setStatus(`No topic matches "${raw}" yet. Pick one below.`);
      }
    });

    function setStatus(msg) {
      const s = $("status");
      if (!msg) { s.classList.add("hidden"); return; }
      s.textContent = msg;
      s.classList.remove("hidden");
    }

    async function loadDigest(slug) {
      $("digest").classList.add("hidden");
      setStatus("Reading the room on " + slug + "... this can take a few seconds.");
      try {
        const res = await fetch("/api/digest/" + slug);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          setStatus(body.detail || "Something went wrong.");
          return;
        }
        render(await res.json());
        setStatus("");
      } catch {
        setStatus("Could not reach the server.");
      }
    }

    function render(d) {
      $("d-title").textContent = d.query || d.topic;
      const when = new Date(d.generated_at).toLocaleString();
      $("d-meta").textContent =
        `${d.source} - ${d.date} - ${d.cached ? "cached" : "fresh"} - ${d.model_used} - generated ${when}`;
      $("d-overview").textContent = d.overview;

      $("d-topics").innerHTML = "";
      for (const t of d.hot_topics) {
        const el = document.createElement("div");
        el.className = "topic";
        el.innerHTML = `<strong>${t.title}</strong><br>${t.summary}`;
        $("d-topics").appendChild(el);
      }

      $("d-posts").innerHTML = "";
      for (const p of d.top_posts) {
        const el = document.createElement("div");
        el.className = "post";
        el.innerHTML =
          `<a href="${p.permalink}" target="_blank" rel="noopener">${p.title}</a>` +
          `<div class="post-meta">${p.score} points - ${p.num_comments} comments</div>`;
        $("d-posts").appendChild(el);
      }

      $("digest").classList.remove("hidden");
    }

    loadTopics();
  </script>
</body>
</html>
