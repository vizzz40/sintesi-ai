services:
  - type: web
    name: sintesi
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/sintesi.db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CONTENT_SOURCE
        value: hackernews
      - key: ALLOW_FREEFORM_SEARCH
        value: false
