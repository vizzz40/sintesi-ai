services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sintesi
      POSTGRES_PASSWORD: sintesi
      POSTGRES_DB: sintesi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sintesi"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sintesi:sintesi@db:5432/sintesi
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ALLOW_FREEFORM_SEARCH: ${ALLOW_FREEFORM_SEARCH:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
